# Supabase config (PoC)
# Reference: https://supabase.com/docs/guides/cli/config

project_id = "figma-mcp-poc"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false   # PoC: prevent random sign-ups

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false  # PoC: skip email confirm flow
