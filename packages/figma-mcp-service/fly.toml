app = "figma-mcp-poc-service"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  LOG_LEVEL = "info"
  STORAGE_BUCKET = "figma-assets"

[http_service]
  internal_port = 3000
  force_https = true
  # Sessions are kept in-memory; do not auto-stop or scale out.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
